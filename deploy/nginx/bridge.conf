# Bridge dev edge proxy — single exposed port (3100).
#
# Routes:
#   /hocuspocus  -> Hocuspocus Yjs WebSocket server   (127.0.0.1:4000)
#   /            -> Next.js dev server                (127.0.0.1:3101),
#                   which itself proxies /api/* to the Go API (127.0.0.1:8101)
#                   via next.config.ts rewrites.
#
# Only port 3100 needs to be exposed / tunneled. 3101, 4000 and 8101 stay on
# loopback. Keep these ports in sync with .env (NEXTJS_PORT, HOCUSPOCUS_PORT,
# PLATFORM_PORT).
#
# Install:
#   sudo cp deploy/nginx/bridge.conf /etc/nginx/conf.d/bridge.conf
#   sudo nginx -t && sudo systemctl reload nginx
# (Free port 3100 first by restarting the app services so Next.js moves to 3101.)

# Conditional Connection header for WebSocket upgrades. Uniquely named to avoid
# colliding with any map already defined by the existing default site.
map $http_upgrade $bridge_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 3100;
    listen [::]:3100;
    server_name _;

    # Yjs realtime collaboration — always a WebSocket upgrade. Hocuspocus reads
    # the document name from protocol messages (not the URL path), so no
    # prefix-stripping is needed; it ignores the /hocuspocus path.
    location /hocuspocus {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;   # long-lived collab sockets
        proxy_send_timeout 86400;
    }

    # Next.js (web app + its server-side /api proxy to Go). Upgrade headers are
    # conditional so the dev-mode HMR websocket also works.
    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $bridge_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
}
